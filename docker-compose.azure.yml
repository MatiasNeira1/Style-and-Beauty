# Azure/VM-oriented compose file.
# This file is intended for an Azure VM or local production rehearsal using
# published Docker Hub images and managed databases. Azure Container Apps is the
# recommended target for the academic deployment, but it is configured with az
# commands/Bicep/Terraform rather than docker compose directly.

x-hikari-env: &hikari-env
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-2}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-0}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-30000}
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:-300000}

services:
  api-gateway:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_CORS_ALLOWED_ORIGINS}}
      MS_AUTH_URI: ${MS_AUTH_URI:-http://ms-auth:8081}
      MS_PERFILES_URI: ${MS_PERFILES_URI:-http://ms-perfiles:8082}
      MS_CATALOGO_URI: ${MS_CATALOGO_URI:-http://ms-catalogo:8083}
      MS_AGENDA_URI: ${MS_AGENDA_URI:-http://ms-agenda:8084}
      MS_INVENTARIO_URI: ${MS_INVENTARIO_URI:-http://ms-inventario:8085}
      MS_PAGOS_URI: ${MS_PAGOS_URI:-http://ms-pagos:8086}
      MS_EXTRA_URI: ${MS_EXTRA_URI:-http://ms-extra:8087}
      MS_NOTIFICACION_AUDIT_URI: ${MS_NOTIFICACION_AUDIT_URI:-http://ms-notificacion-audit:8088}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  ms-auth:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-auth:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    expose:
      - "8081"

  ms-perfiles:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-perfiles:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *hikari-env
      SERVER_PORT: 8082
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-${MS_PERFILES_DATASOURCE_URL}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MS_PERFILES_DATASOURCE_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MS_PERFILES_DATASOURCE_PASSWORD}}
      MS_PERFILES_DATASOURCE_URL: ${MS_PERFILES_DATASOURCE_URL}
      MS_PERFILES_DATASOURCE_USERNAME: ${MS_PERFILES_DATASOURCE_USERNAME}
      MS_PERFILES_DATASOURCE_PASSWORD: ${MS_PERFILES_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-stylebeauty}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    expose:
      - "8082"

  ms-catalogo:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-catalogo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *hikari-env
      SERVER_PORT: 8083
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      MS_PERFILES_URL: ${MS_PERFILES_URL:-http://ms-perfiles:8082}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-${MS_CATALOGO_DATASOURCE_URL}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MS_CATALOGO_DATASOURCE_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MS_CATALOGO_DATASOURCE_PASSWORD}}
      MS_CATALOGO_DATASOURCE_URL: ${MS_CATALOGO_DATASOURCE_URL}
      MS_CATALOGO_DATASOURCE_USERNAME: ${MS_CATALOGO_DATASOURCE_USERNAME}
      MS_CATALOGO_DATASOURCE_PASSWORD: ${MS_CATALOGO_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-stylebeauty}
    expose:
      - "8083"

  ms-agenda:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-agenda:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *hikari-env
      SERVER_PORT: 8084
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      MS_PERFILES_URL: ${MS_PERFILES_URL:-http://ms-perfiles:8082}
      MS_CATALOGO_URL: ${MS_CATALOGO_URL:-http://ms-catalogo:8083}
      APP_AGENDA_ZONE: ${APP_AGENDA_ZONE:-America/Santiago}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-${MS_AGENDA_DATASOURCE_URL}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MS_AGENDA_DATASOURCE_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MS_AGENDA_DATASOURCE_PASSWORD}}
      MS_AGENDA_DATASOURCE_URL: ${MS_AGENDA_DATASOURCE_URL}
      MS_AGENDA_DATASOURCE_USERNAME: ${MS_AGENDA_DATASOURCE_USERNAME}
      MS_AGENDA_DATASOURCE_PASSWORD: ${MS_AGENDA_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-never}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_FAIL_ON_ERROR: ${GOOGLE_CALENDAR_FAIL_ON_ERROR:-false}
      GOOGLE_CALENDAR_CREDENTIALS_JSON: ${GOOGLE_CALENDAR_CREDENTIALS_JSON:-}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:-}
      GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID: ${GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    expose:
      - "8084"

  ms-inventario:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-inventario:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *hikari-env
      SERVER_PORT: 8085
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-${MS_INVENTARIO_DATASOURCE_URL}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MS_INVENTARIO_DATASOURCE_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MS_INVENTARIO_DATASOURCE_PASSWORD}}
      MS_INVENTARIO_DATASOURCE_URL: ${MS_INVENTARIO_DATASOURCE_URL}
      MS_INVENTARIO_DATASOURCE_USERNAME: ${MS_INVENTARIO_DATASOURCE_USERNAME}
      MS_INVENTARIO_DATASOURCE_PASSWORD: ${MS_INVENTARIO_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-stylebeauty}
    expose:
      - "8085"

  ms-pagos:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-pagos:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *hikari-env
      SERVER_PORT: 8086
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-${MS_PAGOS_DATASOURCE_URL}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MS_PAGOS_DATASOURCE_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MS_PAGOS_DATASOURCE_PASSWORD}}
      MS_PAGOS_DATASOURCE_URL: ${MS_PAGOS_DATASOURCE_URL}
      MS_PAGOS_DATASOURCE_USERNAME: ${MS_PAGOS_DATASOURCE_USERNAME}
      MS_PAGOS_DATASOURCE_PASSWORD: ${MS_PAGOS_DATASOURCE_PASSWORD}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_USER_PASSWORD: ${SPRING_SECURITY_USER_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      MS_AGENDA_BASE_URL: ${MS_AGENDA_BASE_URL:-${MS_AGENDA_URI:-http://ms-agenda:8084}}
      MS_CATALOGO_BASE_URL: ${MS_CATALOGO_BASE_URL:-${MS_CATALOGO_URI:-http://ms-catalogo:8083}}
    expose:
      - "8086"

  ms-notificacion-audit:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-notificacion-audit:${IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: ["audit"]
    environment:
      SERVER_PORT: 8088
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_USER_PASSWORD: ${SPRING_SECURITY_USER_PASSWORD}
    expose:
      - "8088"

  frontend:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_USER:-watoncitoxx}/style-and-beauty-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"

