spring.cloud.gateway.server.webflux.routes[11].id=swagger-agenda
spring.cloud.gateway.server.webflux.routes[11].uri=${MS_AGENDA_URI:http://ms-agenda:8084}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/aggregate/agenda/v3/api-docs
spring.cloud.gateway.server.webflux.routes[11].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[12].id=swagger-inventario
spring.cloud.gateway.server.webflux.routes[12].uri=${MS_INVENTARIO_URI:http://ms-inventario:8085}
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/aggregate/inventario/v3/api-docs
spring.cloud.gateway.server.webflux.routes[12].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[13].id=swagger-pagos
spring.cloud.gateway.server.webflux.routes[13].uri=${MS_PAGOS_URI:http://ms-pagos:8086}
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/aggregate/pagos/v3/api-docs
