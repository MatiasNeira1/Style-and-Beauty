spring.cloud.gateway.server.webflux.routes[14].id=swagger-extra
spring.cloud.gateway.server.webflux.routes[14].uri=${MS_EXTRA_URI:http://ms-extra:8087}
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/aggregate/extra/v3/api-docs
