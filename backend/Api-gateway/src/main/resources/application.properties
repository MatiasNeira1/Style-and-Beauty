spring.cloud.gateway.server.webflux.routes[16].id=root-redirect
spring.cloud.gateway.server.webflux.routes[16].uri=no://op
spring.cloud.gateway.server.webflux.routes[16].predicates[0]=Path=/
spring.cloud.gateway.server.webflux.routes[16].filters[0]=RedirectTo=302,/swagger-ui.html
