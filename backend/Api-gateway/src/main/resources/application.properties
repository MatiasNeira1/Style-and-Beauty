spring.cloud.gateway.server.webflux.routes[15].id=swagger-notificacion-audit
spring.cloud.gateway.server.webflux.routes[15].uri=${MS_NOTIFICACION_AUDIT_URI:http://ms-notificacion-audit:8088}
