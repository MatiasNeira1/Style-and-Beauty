spring.application.name=ms-agenda
server.port=${SERVER_PORT:8084}
app.ms-perfiles.base-url=${MS_PERFILES_URL:http://ms-perfiles:8082}
app.ms-catalogo.base-url=${MS_CATALOGO_URL:http://ms-catalogo:8083}
app.agenda.zone=${APP_AGENDA_ZONE:America/Santiago}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ms_agenda_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
