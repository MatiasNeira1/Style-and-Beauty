spring.application.name=ms-agenda
server.port=${SERVER_PORT:8084}
app.ms-perfiles.base-url=${MS_PERFILES_URL:http://ms-perfiles:8082}
app.ms-catalogo.base-url=${MS_CATALOGO_URL:http://ms-catalogo:8083}
app.agenda.zone=${APP_AGENDA_ZONE:America/Santiago}
app.google-calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.google-calendar.fail-on-error=${GOOGLE_CALENDAR_FAIL_ON_ERROR:true}
app.google-calendar.credentials-json=${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
app.google-calendar.credentials-path=${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
app.google-calendar.default-calendar-id=${GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID:}

spring.datasource.url=${DATABASE_URL:${MS_AGENDA_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:style_beauty}}}
spring.datasource.username=${DATABASE_USER:${MS_AGENDA_DATASOURCE_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${MS_AGENDA_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
