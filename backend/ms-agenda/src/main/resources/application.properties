spring.application.name=ms-agenda
server.port=${SERVER_PORT:8084}
app.ms-perfiles.base-url=${MS_PERFILES_URL:${MS_PERFILES_URI:${PERFILES_SERVICE_URL:http://ms-perfiles:8082}}}
app.ms-catalogo.base-url=${MS_CATALOGO_URL:${MS_CATALOGO_URI:${CATALOGO_SERVICE_URL:http://ms-catalogo:8083}}}
app.agenda.zone=${APP_AGENDA_ZONE:America/Santiago}
app.google-calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.google-calendar.fail-on-error=${GOOGLE_CALENDAR_FAIL_ON_ERROR:false}
app.google-calendar.credentials-json=${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
app.google-calendar.credentials-path=${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
app.google-calendar.default-calendar-id=${GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID:}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${MS_AGENDA_DATASOURCE_URL}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:${MS_AGENDA_DATASOURCE_USERNAME}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${MS_AGENDA_DATASOURCE_PASSWORD}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:300000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_AGENDA_ZONE:America/Santiago}
spring.jpa.open-in-view=false
spring.jackson.time-zone=${APP_AGENDA_ZONE:America/Santiago}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
