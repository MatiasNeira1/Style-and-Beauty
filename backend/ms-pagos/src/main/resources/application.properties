spring.application.name=ms-pagos
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DATABASE_URL:${MS_PAGOS_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:style_beauty}}}
spring.datasource.username=${DATABASE_USER:${MS_PAGOS_DATASOURCE_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${MS_PAGOS_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

tbk.commerce-code=${TBK_COMMERCE_CODE:597055555532}
tbk.api-key=${TBK_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
tbk.return-url=${TBK_RETURN_URL:http://localhost:8080/api/pagos/webpay/retorno}
frontend.success-url=${FRONTEND_SUCCESS_URL:http://localhost/pago/exitoso}
frontend.error-url=${FRONTEND_ERROR_URL:http://localhost/pago/error}

ms.agenda.base-url=${MS_AGENDA_BASE_URL:http://localhost:8084}
ms.catalogo.base-url=${MS_CATALOGO_BASE_URL:http://localhost:8083}
