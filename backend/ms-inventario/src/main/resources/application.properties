spring.application.name=ms-inventario
server.port=${SERVER_PORT:8085}

spring.datasource.url=${MS_INVENTARIO_DATASOURCE_URL:jdbc:postgresql://localhost:5432/style_beauty}
spring.datasource.username=${MS_INVENTARIO_DATASOURCE_USERNAME:}
spring.datasource.password=${MS_INVENTARIO_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
