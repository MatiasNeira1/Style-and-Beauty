x-hikari-env: &hikari-env
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-2}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-0}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-30000}
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-30000}
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:-300000}

services:
  postgres-master:
    image: postgres:16-alpine
    container_name: style-beauty-postgres-master
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-style_beauty}
      POSTGRES_USER: ${POSTGRES_USER:-style_beauty_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_app}
      TZ: ${TZ:-America/Santiago}
      PGTZ: ${TZ:-America/Santiago}
    expose:
      - "5432"
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./deploy/postgres/master/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-style_beauty_app} -d ${POSTGRES_DB:-style_beauty} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  api-gateway:
    build: ./backend/Api-gateway
    image: watoncitoxx/style-and-beauty-gateway:latest
    container_name: style-beauty-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://styleandbeauty.me,https://www.styleandbeauty.me,http://localhost,http://localhost:80,http://localhost:5173}
      MS_AUTH_URI: http://ms-auth:8081
      MS_PERFILES_URI: http://ms-perfiles:8082
      MS_CATALOGO_URI: http://ms-catalogo:8083
      MS_AGENDA_URI: http://ms-agenda:8084
      MS_INVENTARIO_URI: http://ms-inventario:8085
      MS_PAGOS_URI: http://ms-pagos:8086
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      ms-auth:
        condition: service_started
      ms-perfiles:
        condition: service_started
      ms-catalogo:
        condition: service_started
      ms-agenda:
        condition: service_started
      ms-inventario:
        condition: service_started
      ms-pagos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-auth:
    build: ./backend/ms-auth
    image: watoncitoxx/style-and-beauty-auth:latest
    container_name: style-beauty-ms-auth
    
    environment:
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/firebase-service-account.json}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8081/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-perfiles:
    build: ./backend/ms-perfiles
    image: watoncitoxx/style-and-beauty-perfiles:latest
    container_name: style-beauty-ms-perfiles
   
    environment:
      <<: *hikari-env
      SERVER_PORT: 8082
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_DATASOURCE_URL: ${MS_PERFILES_DATASOURCE_URL:-jdbc:postgresql://postgres-master:5432/${POSTGRES_DB:-style_beauty}}
      SPRING_DATASOURCE_USERNAME: ${MS_PERFILES_DATASOURCE_USERNAME:-${POSTGRES_USER:-style_beauty_app}}
      SPRING_DATASOURCE_PASSWORD: ${MS_PERFILES_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-change_me_app}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-stylebeauty}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/firebase-service-account.json}
    volumes:
      - ./backend/ms-perfiles/src/main/resources/serviceAccountKey.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:${MS_PERFILES_PORT:-8082}:8082"
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8082/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-catalogo:
    build:
      context: ./backend/ms-catalogo
    image: watoncitoxx/style-and-beauty-catalogo:latest
    container_name: style-beauty-ms-catalogo
   
    environment:
      <<: *hikari-env
      SERVER_PORT: 8083
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      MS_PERFILES_URL: http://ms-perfiles:8082
      SPRING_DATASOURCE_URL: ${MS_CATALOGO_DATASOURCE_URL:-jdbc:postgresql://postgres-master:5432/${POSTGRES_DB:-style_beauty}}
      SPRING_DATASOURCE_USERNAME: ${MS_CATALOGO_DATASOURCE_USERNAME:-${POSTGRES_USER:-style_beauty_app}}
      SPRING_DATASOURCE_PASSWORD: ${MS_CATALOGO_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-change_me_app}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-stylebeauty}
    ports:
      - "127.0.0.1:${MS_CATALOGO_PORT:-8083}:8083"
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8083/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net


  ms-agenda:
    build:
      context: ./backend/ms-agenda
    image: watoncitoxx/style-and-beauty-agenda:latest
    container_name: style-beauty-ms-agenda
    
    environment:
      <<: *hikari-env
      SERVER_PORT: 8084
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      MS_PERFILES_URL: http://ms-perfiles:8082
      MS_CATALOGO_URL: http://ms-catalogo:8083
      APP_AGENDA_ZONE: ${APP_AGENDA_ZONE:-America/Santiago}
      APP_AGENDA_MAX_DIAS_ANTICIPACION: ${APP_AGENDA_MAX_DIAS_ANTICIPACION:-30}
      APP_RESERVA_EXPIRACION_MINUTOS: ${APP_RESERVA_EXPIRACION_MINUTOS:-15}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_FAIL_ON_ERROR: ${GOOGLE_CALENDAR_FAIL_ON_ERROR:-true}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:-}
      GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID: ${GOOGLE_CALENDAR_DEFAULT_CALENDAR_ID:-}
      MS_AGENDA_DATASOURCE_URL: ${MS_AGENDA_DATASOURCE_URL:-jdbc:postgresql://postgres-master:5432/${POSTGRES_DB:-style_beauty}}
      MS_AGENDA_DATASOURCE_USERNAME: ${MS_AGENDA_DATASOURCE_USERNAME:-${POSTGRES_USER:-style_beauty_app}}
      MS_AGENDA_DATASOURCE_PASSWORD: ${MS_AGENDA_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-change_me_app}}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/firebase-service-account.json}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
    ports:
      - "127.0.0.1:${MS_AGENDA_PORT:-8084}:8084"
    volumes:
      - ./backend/ms-agenda/src/main/resources/serviceAccountKey.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      ms-catalogo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8084/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-inventario:
    build: ./backend/ms-inventario
    image: watoncitoxx/style-and-beauty-inventario:latest
    container_name: style-beauty-ms-inventario
    
    environment:
      <<: *hikari-env
      SERVER_PORT: 8085
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_DATASOURCE_URL: ${MS_INVENTARIO_DATASOURCE_URL:-jdbc:postgresql://postgres-master:5432/${POSTGRES_DB:-style_beauty}}
      SPRING_DATASOURCE_USERNAME: ${MS_INVENTARIO_DATASOURCE_USERNAME:-${POSTGRES_USER:-style_beauty_app}}
      SPRING_DATASOURCE_PASSWORD: ${MS_INVENTARIO_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-change_me_app}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-stylebeauty}
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8085/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-pagos:
    build: ./backend/ms-pagos
    image: watoncitoxx/style-and-beauty-pagos:latest
    container_name: style-beauty-ms-pagos
    
    environment:
      <<: *hikari-env
      SERVER_PORT: 8086
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_DATASOURCE_URL: ${MS_PAGOS_DATASOURCE_URL:-jdbc:postgresql://postgres-master:5432/${POSTGRES_DB:-style_beauty}}
      SPRING_DATASOURCE_USERNAME: ${MS_PAGOS_DATASOURCE_USERNAME:-${POSTGRES_USER:-style_beauty_app}}
      SPRING_DATASOURCE_PASSWORD: ${MS_PAGOS_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-change_me_app}}
      MS_AGENDA_BASE_URL: http://ms-agenda:8084
      MS_CATALOGO_BASE_URL: http://ms-catalogo:8083
      MS_PERFILES_BASE_URL: http://ms-perfiles:8082
      TBK_COMMERCE_CODE: ${TBK_COMMERCE_CODE:-597055555532}
      TBK_API_KEY: ${TBK_API_KEY:-579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
      TBK_RETURN_URL: ${TBK_RETURN_URL:-http://localhost:8080/api/pagos/webpay/retorno}
      FRONTEND_SUCCESS_URL: ${FRONTEND_SUCCESS_URL:-http://localhost/pago/exitoso}
      FRONTEND_ERROR_URL: ${FRONTEND_ERROR_URL:-http://localhost/pago/error}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8086/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-extra:
    image: watoncitoxx/style-and-beauty-extra:latest
    container_name: style-beauty-ms-extra
    restart: unless-stopped
    environment:
      <<: *hikari-env
      SERVER_PORT: 8087
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_DATASOURCE_URL: ${MS_EXTRA_DATASOURCE_URL:-jdbc:postgresql://postgres-master:5432/${POSTGRES_DB:-style_beauty}}
      SPRING_DATASOURCE_USERNAME: ${MS_EXTRA_DATASOURCE_USERNAME:-${POSTGRES_USER:-style_beauty_app}}
      SPRING_DATASOURCE_PASSWORD: ${MS_EXTRA_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-change_me_app}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8087/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  ms-notificacion-audit:
    image: watoncitoxx/style-and-beauty-notificacion-audit:latest
    container_name: style-beauty-ms-notificacion-audit
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/${MONGO_DB:-style_beauty_audit}
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin123
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8088/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  mongo:
    image: mongo:7
    container_name: style-beauty-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-style_beauty_audit}
    expose:
      - "27017"
    volumes:
      - mongo-audit-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1 >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: style-beauty-frontend
    
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - style-beauty-net

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: style-beauty-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Santiago}
      TZ: ${TZ:-America/Santiago}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-Admin123.}
    volumes:
      - ./n8n/n8n_data:/home/node/.n8n
    networks:
      - style-beauty-net

volumes:
  postgres-master-data:
  mongo-audit-data:

networks:
  style-beauty-net:
    driver: bridge
